[package]
name = "infernaut"
version = "0.1.0"
edition = "2024"
default-run = "infernaut"
description = "A privacy-aware local gateway for local and cloud LLM providers"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SyntaxGeek/infernaut"
homepage = "https://github.com/SyntaxGeek/infernaut"
rust-version = "1.89"
keywords = ["llm", "gateway", "routing", "openai", "anthropic"]
categories = ["command-line-utilities", "network-programming"]
publish = false
exclude = [
    ".env",
    ".env.*",
    "!.env.example",
    ".infernaut/**",
    "infernaut.toml",
    "infernaut.toml.bak-*",
    "infernaut.toml.lock",
    "config/**",
    "*router.toml",
    "*router.toml.bak-*",
    "sniffer.toml",
    "*.log",
    "*.pid",
    ".DS_Store",
    ".idea/**",
    ".vscode/**",
]

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
async-stream = "0.3"
base64 = "0.22"
bytes = "1.11"
crossterm = "0.29"
futures-util = "0.3"
flate2 = "1.1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["full"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
